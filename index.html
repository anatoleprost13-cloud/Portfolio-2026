<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anatole Prost</title>

<style>
/* =====================
   RESET GLOBAL
===================== */
* { margin:0; padding:0; box-sizing:border-box; }

/* =====================
   BODY + SCROLL
===================== */
html, body {
  width: 100vw;         
  height: 100%;         
  overflow-x: hidden;   
  overflow-y: auto;     
  touch-action: pan-y;  
  font-family: 'HelveticaNeue', sans-serif;
  background: black;
}

/* =====================
   GRID DES CARTES
===================== */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px;
  width: 90%;
  max-width: 1200px;
  margin: 0 auto; /* centre horizontalement */
}

/* GRID MOBILE */
@media (max-width: 768px) {
  #grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    width: 95%;
    margin: 0 auto;
  }
}

@media (max-width: 480px) {
  #grid {
    grid-template-columns: 1fr;
    width: 95%;
    margin: 0 auto;
  }
}

/* =====================
   CARTES
===================== */
.card {
  width: 100%;
  max-width: 100%; /* empêche les débordements */
  aspect-ratio:6.35/8.89;
  border-radius:12px;
  transform-style:preserve-3d;
  transition: transform 0.6s ease, box-shadow 0.3s ease;
  cursor:pointer;
  position:relative;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* FRONT/BACK et intro : tu gardes ton CSS actuel pour ça */

/* =====================
   CURSEUR ET MOUCHES
===================== */
img[src*="mouche.png"] {
  position: fixed !important;
  pointer-events: none;
  z-index: 3000;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 120px;
}

/* Sur mobile tactile, laisse visible */
@media (hover: none) and (pointer: coarse) {
  img[src*="mouche.png"] {
    display: block;
  }
}

/* =====================
   EMAIL EN HAUT
===================== */
#email {
  position: fixed;
  top: 20px;
  left: 50%;           
  transform: translateX(-50%);  
  color: white;
  font-size: 0.9rem;
  font-family: 'HelveticaNeue', sans-serif;
  z-index: 4000;
  user-select: none;
  white-space: nowrap;
}

#email span {
  display: inline-block;
  transition: transform 0.8s cubic-bezier(.19,1,.22,1);
  will-change: transform;
}

/* Force curseur système invisible partout */
html, body, * {
  cursor: none !important;
}
</style>
</head>

<body>

<div id="email">anatoleprost13@gmail.com</div>
<div id="grid"></div>

<script src="script.js"></script>
<script>
// =====================
// EMAIL PANIC
// =====================
const email = document.getElementById('email');
const text = email.textContent;
email.innerHTML = '';

const letters = [];
[...text].forEach(char => {
  const span = document.createElement('span');
  span.textContent = char;
  email.appendChild(span);
  letters.push(span);
});

function panicLetters() {
  letters.forEach(l => {
    const dx = (Math.random() - 0.5) * 120;
    const dy = (Math.random() - 0.5) * 120;
    const r  = (Math.random() - 0.5) * 60;
    l.style.transform = `translate(${dx}px, ${dy}px) rotate(${r}deg)`;
  });
}

function calmLetters() {
  letters.forEach(l => {
    l.style.transform = `translate(0,0) rotate(0deg)`;
  });
}

email.addEventListener('mouseenter', panicLetters);
email.addEventListener('mouseleave', calmLetters);

// =====================
// CURSEUR SYSTÈME BLOQUÉ
// =====================
document.addEventListener('mouseleave', () => {
  document.documentElement.style.cursor = 'none';
});
document.addEventListener('mouseenter', () => {
  document.documentElement.style.cursor = 'none';
});
</script>

</body>
</html>
